{% extends 'base.html' %}
{% block conteudo %}

<h2>Recuperar Senha</h2>

<form action="/recuperar_senha" method="post">

    <div class="mb-3">
        <label>Email</label>
        <input
            type="email"
            name="email"
            class="form-control"
            required>
    </div>

    <button class="btn btn-primary">
        Gerar Link
    </button>

    <a href="/" class="btn btn-secondary">
        Voltar
    </a>

</form>

{% endblock %}
