<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Cliente</title>
</head>
<body>

    <h1>Cadastrar Cliente</h1>

    <form action="/formCadastrar" method="POST">

        <label>Nome:</label>
        <br>
        <input type="text" name="nome" required>

        <br><br>

        <label>Email:</label>
        <br>
        <input type="email" name="email" required>

        <br><br>

        <button type="submit">Cadastrar</button>

    </form>

    <br>

    <a href="/">
        Voltar
    </a>

</body>
</html>
