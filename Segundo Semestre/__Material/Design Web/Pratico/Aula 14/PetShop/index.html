<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PetShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .carousel-item img {
            max-height: 650px;
            object-fit: cover;
        }

        .services {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            color: #5C3224;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar" style="background-color: #F4EFEA;" data-bs-theme="light">
        <div class="container-fluid">
            <a class="navbar-brand" style="color: #5C3224; font-weight: bold;" href="#">Petshop</a>
            <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Buscar..." aria-label="Search" />
                <button class="btn" style="border-color: #A85D44; color: #A85D44; background-color: transparent;" type="submit">Buscar</button>
            </form>
        </div>
    </nav>

    <!-- Carousel -->
    <div id="carouselExample" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="imgs/carousel_labrador.jpg" class="d-block w-100" alt="Labrador">
            </div>
            <div class="carousel-item">
                <img src="imgs/carousel_husky.jpg" class="d-block w-100" alt="Husky">
            </div>
            <div class="carousel-item">
                <img src="imgs/carousel_cat.jpg" class="d-block w-100" alt="Gato Tigrado">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>

    <!-- h2 -->
    <div class="container my-4">
        <h2 class="services">Serviços Disponíveis! <span class="badge ms-2" style="background-color: #A85D44;">New</span></h2>
    </div>

    <!-- Grid -->
    <div class="container text-center mb-5">
        <div class="row g-4">

            <!-- Card 01 -->
            <div class="col-12 col-md-4 d-flex justify-content-center">
                <div class="card" style="width: 18rem; border-color: #E2D9D0; background-color: #FCFAf8;">
                    <img src="imgs/card_bath.jpg" class="card-img-top" alt="Banho">
                    <div class="card-body">
                        <h5 class="card-title" style="color: #5C3224; font-weight: 600;">Banho</h5>
                        <p class="card-text" style="color: #6C635E;">Banho completo.</p>
                        <a href="#" class="btn text-white" style="background-color: #A85D44; border: none;">Marcar!</a>
                    </div>
                </div>
            </div>

            <!-- Card 02 -->
            <div class="col-12 col-md-4 d-flex justify-content-center">
                <div class="card" style="width: 18rem; border-color: #E2D9D0; background-color: #FCFAf8;">
                    <img src="imgs/card_grooming.jpg" class="card-img-top" alt="Tosa">
                    <div class="card-body">
                        <h5 class="card-title" style="color: #5C3224; font-weight: 600;">Tosa<span class="badge ms-2" style="background-color: #A85D44;">New</span></h5>
                        <p class="card-text" style="color: #6C635E;">Tosa completa.</p>
                        <a href="#" class="btn text-white" style="background-color: #A85D44; border: none;">Marcar!</a>
                    </div>
                </div>
            </div>

            <!-- Card 03 -->
            <div class="col-12 col-md-4 d-flex justify-content-center">
                <div class="card" style="width: 18rem; border-color: #E2D9D0; background-color: #FCFAf8;">
                    <img src="imgs/card_toys.jpg" class="card-img-top" alt="Brinquedos">
                    <div class="card-body">
                        <h5 class="card-title" style="color: #5C3224; font-weight: 600;">Brinquedos e outros</h5>
                        <p class="card-text" style="color: #6C635E;">Brinquedos, roupas e mais.</p>
                        <a href="#" class="btn text-white" style="background-color: #A85D44; border: none;">Comprar!</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-3 mt-auto border-top" style="background-color: #5C3224;">
        <div class="container">
            <p class="card-text text-white"><strong>Nome do Aluno:</strong> Cauã de Araujo Sousa</p>
            <p class="card-text text-white"><strong>Matrícula:</strong> 202520174</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
