<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Volta da Cintia!!</title>
    </head>
    <body>
        <div class="introducaoTabela">
            <h1>Tabelas em HTML</h1>
            <h2>Estrutura Basica</h2>
            <p>A tag é "table"</p>
            <p>Tag "th" define cabeçalo</p>
            <p>Tag "tr" cria linas</p>
            <p>Tag "td" cria celulas</p>
        </div>
        <div class="exemploTabela">
            <table>
                <tr>
                    <th>Nome</th>
                    <th>Idade</th>
                </tr>
                <tr>
                    <td>Maria</td>
                    <td>25</td>
                </tr>
            </table>
        </div>
        <div>
            <a href="page02.html">Proxima Pagina</a>
        </div>
    </body>
</html>
