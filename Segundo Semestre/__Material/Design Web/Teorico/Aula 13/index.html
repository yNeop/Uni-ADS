<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar" style="background-color: #FAF9F6;" data-bs-theme="light">
        <div class="container-fluid">
            <a class="navbar-brand">Itália</a>
            <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Buscar..." aria-label="Search" />
                <button class="btn btn-outline-dark" type="submit">Buscar</button>
            </form>
        </div>
    </nav>

    <!-- Carousel -->
    <div id="carouselExample" class="carousel slide">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="imgs/carousel1.jpg" class="d-block w-100"
                    alt="Manhã">
            </div>
            <div class="carousel-item">
                <img src="imgs/carousel2.jpg" class="d-block w-100"
                    alt="Tarde">
            </div>
            <div class="carousel-item">
                <img src="imgs/carousel3.jpg" class="d-block w-100"
                    alt="Anoitecer">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>

    <h1 class="display-6">Saiba mais</h1>

    <!-- Grid -->
    <div class="container text-center">
        <div class="row">
            <div class="col">

                <!-- Card 1 -->
                <div class="card" style="width: 18rem;">
                    <img src="imgs/card1.jpg" class="card-img-top" alt="...">
                    <div class="card-body">
                        <h5 class="card-title">Vernazza, La Spezia, Italië</h5>
                        <p class="card-text">Primeiro exemplo de Card, nascer do sol.</p>
                        <a href="#" class="btn btn-dark">Go to Carousel</a>
                    </div>
                </div>
            </div>
            <div class="col">

                <!-- Card 2 -->
                <div class="card" style="width: 18rem;">
                    <img src="imgs/card2.jpg" class="card-img-top" alt="...">
                    <div class="card-body">
                        <h5 class="card-title">Vernazza, La Spezia, Italië</h5>
                        <p class="card-text">Segundo exemplo de Card, durante a tarde.</p>
                        <a href="#" class="btn btn-dark">Go to Carousel</a>
                    </div>
                </div>
            </div>
            <div class="col">

                <!-- Card 3 -->
                <div class="card" style="width: 18rem;">
                    <img src="imgs/card3.jpg" class="card-img-top" alt="...">
                    <div class="card-body">
                        <h5 class="card-title">Vernazza, La Spezia, Italië</h5>
                        <p class="card-text">Segundo exemplo de Card, por do sol.</p>
                        <a href="#" class="btn btn-dark">Go to Carousel</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
